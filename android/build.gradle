buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['ShenzhiAdGromore_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ShenzhiAdGromore_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.shenzhiadgromore"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    
    // 设置支持的 SO 库架构
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a"
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

// 定义一个属性，用于控制是否包含测试工具
// 可以通过 ./gradlew -PexcludeTestTools=true 命令行参数来控制
def excludeTestTools = project.hasProperty('excludeTestTools') ? project.property('excludeTestTools').toBoolean() : false

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  
  // 融合基础包，必须引入
  implementation(name: "open_ad_sdk_6.7.0.6", ext: 'aar')
  
  // 测试工具,不可带到线上
  // 只在debug构建且未指定excludeTestTools=true时添加
  def debugBuild = true
  gradle.startParameter.taskNames.each {
    if (it.contains('Release') || it.contains('release')) {
      debugBuild = false
    }
  }
  
  if (debugBuild && !excludeTestTools) {
    implementation(name: 'tools-release', ext: 'aar')
  }
}

react {
  jsRootDir = file("../src/")
  libraryName = "ShenzhiAdGromore"
  codegenJavaPackageName = "com.shenzhiadgromore"
}

// 添加一个任务用于删除测试工具文件
task removeTestTools {
  doLast {
    def testToolsFile = file("libs/tools-release.aar")
    if (testToolsFile.exists()) {
      testToolsFile.delete()
      println "测试工具已被移除"
    } else {
      println "测试工具文件不存在"
    }
  }
}

// 如果使用release构建，自动执行removeTestTools任务
tasks.whenTaskAdded { task ->
  if (task.name.contains("assembleRelease") || task.name.contains("bundleRelease")) {
    task.dependsOn removeTestTools
  }
}
